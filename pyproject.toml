[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluorescence-inference"
version = "0.1.0"
description = "Statistical inference on standardized paired-readout neutral-atom fluorescence data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Peiran Niu" }]
maintainers = [{ name = "Peiran Niu" }]
keywords = ["neutral atoms", "fluorescence imaging", "statistical inference", "paired readout"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
