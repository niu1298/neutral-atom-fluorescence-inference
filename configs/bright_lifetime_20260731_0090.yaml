  commanded_switch_state_during_bright_wait: "science_imaging_switches_on"
  commanded_switch_state_during_exposure: "science_imaging_switches_on"
  commanded_switch_state_during_interframe_gap: "science_imaging_switches_off"
  imaging_dds_device: "dds_1"
  imaging_dds_channels: [0, 2]
  imaging_dds_command_during_bright_wait: "on"
  imaging_dds_command_during_exposure: "on"
  imaging_dds_command_during_interframe_gap: "zero_amplitude"
  independent_optical_power_readback_available: false
