  geometry_version: "20260731.0090.g1"
  variance_frames: [0, 1]
  highpass_sigma: 30.0
  score_smooth_sigma: 0.8
  clip_negative: true
  density_sigma: 12.0
  density_percentile: 97.0
  min_component_px: 200
