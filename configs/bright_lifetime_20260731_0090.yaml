split:
  strategy: chronological_cycle_60_20_20
  sensitivity_strategy: seeded_cycle_60_20_20
  sensitivity_seed: 20260731

extraction: {fit_scope: train}
timing: {bright_wait_global: "WAIT_BEFORE_FIRST_FLUOR"}

sites:
